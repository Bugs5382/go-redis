name: Release Drafter
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
