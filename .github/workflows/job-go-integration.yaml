name: Integration
# Runs the integration tests (-tags integration) against a real Redis service
# container. REDIS_TEST_REQUIRED makes a missing REDIS_ADDR fail the run instead
# of skipping every test, so broken service wiring shows up as a red job rather
# than a green run of skipped tests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    name: 🧱 Integration (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_TEST_REQUIRED: '1'
      REDIS_ADDR: localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags integration -race -count=1 -timeout 5m -v ./...
